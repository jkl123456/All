<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作品详情 · AI 造物馆·智纪元</title>
<meta name="description" content="AI 造物馆·智纪元 作品详情：PC 与手机截图、介绍、玩法、点赞收藏与评论。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230f1222'/%3E%3Cpath d='M16 7l7 9-7 9-7-9z' fill='none' stroke='%23fff' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="detail.css">
</head>
<body class="detail-body">
<div class="orb orb-a" aria-hidden="true"></div>

<header class="topbar">
  <a class="brand" href="index.html">
    <span class="brand-mark">◇</span>
    <span class="brand-text">AI 造物馆·智纪元<small>AI MAKER GALLERY</small></span>
  </a>
  <div class="topbar-right">
    <a class="top-link" href="index.html">作品墙</a>
    <span class="user-slot" id="userSlot">
      <a class="top-link" href="auth.html">登录</a>
      <a class="nav-cta" href="submit.html">发布作品</a>
    </span>
  </div>
</header>

<main class="detail-wrap" id="detailRoot">
  <a class="back" href="index.html">← 返回作品墙</a>

  <div class="status-banner hidden" id="statusBanner"></div>

  <section class="project-head">
    <div class="cats" id="dCats"></div>
    <h1 id="dName">加载中…</h1>
    <p class="tagline" id="dTagline"></p>
    <div class="publish-line"><span id="dDate"></span></div>
    <div class="head-meta">
      <div class="meta-line" id="dPlatforms"></div>
      <div class="chips" id="dStack"></div>
    </div>
    <div class="head-actions" id="dActions"></div>
  </section>

  <section class="shots-block" id="dShots"></section>

  <section class="detail-grid">
    <article class="content-card">
      <h2>介绍</h2>
      <div class="prose clamped" id="dDesc"></div>
      <button class="toggle-btn hidden" type="button" id="descToggle">展开全文 ↓</button>

      <h2>玩法 / 功能</h2>
      <div class="feature-wrap clamped" id="gameplayWrap">
        <ul class="feature-list" id="dGameplay"></ul>
      </div>
      <button class="toggle-btn hidden" type="button" id="gameplayToggle">展开全部 ↓</button>
    </article>

    <aside class="side-card">
      <h3>技术栈</h3>
      <div class="chips" id="dSideStack"></div>

      <h3>平台</h3>
      <div class="platform-list" id="dSidePlatforms"></div>

      <h3>开源地址</h3>
      <div class="repo-box" id="dRepoBox"></div>

      <h3>联系作者</h3>
      <div class="contact-box" id="dContact"></div>

      <h3>关注公众号</h3>
      <div class="wechat-mini">
        <span class="wechat-label">微信公众号</span>
        <strong>智纪元AD</strong>
        <span class="wechat-hint">微信搜索「智纪元AD」关注</span>
      </div>

      <button class="btn ghost block" type="button" id="copyLink">复制本页链接</button>
    </aside>
  </section>

  <section class="comments" id="comments">
    <div class="comments-head">
      <h2>评论 <span id="commentCount">0</span></h2>
      <span class="comments-hint">登录后可以留言</span>
    </div>
    <div class="comment-editor" id="commentEditor"></div>
    <div class="comment-list" id="commentList"></div>
  </section>

  <nav class="pager" id="dPager"></nav>
</main>

<div class="action-bar" id="actionBar">
  <button type="button" data-action="like" aria-pressed="false">
    <span class="ico">♡</span><span class="label">点赞</span><em id="likeCount">0</em>
  </button>
  <button type="button" data-action="favorite" aria-pressed="false">
    <span class="ico">☆</span><span class="label">收藏</span><em id="favCount">0</em>
  </button>
  <button type="button" data-action="comment">
    <span class="ico">💬</span><span class="label">评论</span><em id="commentCountBar">0</em>
  </button>
</div>

<footer>
  <span>AI 造物馆·智纪元 · 用 AI 做的东西值得被看见</span>
  <span>公众号 <b>智纪元AD</b> · QQ <b>993739647</b></span>
</footer>

<div class="lightbox" id="lightbox" aria-hidden="true">
  <button class="lightbox-close" type="button" aria-label="关闭">✕</button>
  <img id="lightboxImg" alt="">
</div>

<div class="toast" id="toast" role="status"></div>

<script src="data/projects.js"></script>
<script src="api.js"></script>
<script src="detail.js"></script>
</body>
</html>
