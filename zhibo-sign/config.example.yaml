server:
  host: 127.0.0.1
  port: 8850            # 和原来的画头像项目（8848）错开，两个可以同时跑

platform:
  type: external        # external = 真直播间 | mock = 本机假观众（不调 AI）
  mock:
    # 本机造的假观众：队列里会冒弹幕和礼物，但**不会调豆包**——
    # 这些单只播 data/signatures 里现成的同名成图（见 app/library.py），
    # 没开直播的时候挂着也不会烧额度。
    interval: 12        # 每 12 秒模拟一个观众说名字，其中一部分会接着送礼
  external:
    # 抖音走这条路：先跑 scripts/douyin_browser.py，它会在这个地址上广播事件。
    # 采集器不传 --room 时就用下面这个房间号（直接贴直播间地址也行，
    # https://live.douyin.com/YOUR_ROOM_ID?camera_id=0 → YOUR_ROOM_ID）。
    ws_url: "ws://127.0.0.1:9000/events"
    room: "YOUR_ROOM_ID"

# ---------------------------------------------------------------- 签名本身
# provider: local  = 本地字体提骨架逐笔写（0.1~0.3 秒，免费，永远可用的兜底）
#           sdcn   = 本地扩散模型上质感（字体定字形 + SD1.5/ControlNet 上质感，
#                    一人一张约 2~4 秒，**完全离线、无额度限制**，要装 torch，
#                    推理在独立服务 scripts/sdcn_server.py 里跑）
#           doubao = 豆包网页版出"沙画签名"成图再渐显（约 10~20 秒/张，免费，
#                    用 .chrome-doubao/ 里的登录态，跟画画那个项目一模一样）
#                    注意：网页版现在有额度/付费墙，随时可能不出图。
#           ai     = 火山方舟 API 出图（要 api_key，按张计费）
#
# 推荐：sdcn 为主 + local 兜底。豆包留作备选，别当主路径。
signature:
  provider: sdcn
  font: ""              # 留空自动挑：楷体 -> 华文楷体 -> 新魏 -> 宋体
  width: 1000           # 笔迹坐标系宽度（overlay 按它等比缩放）
  height: 420
  pad: 24
  font_size: 300        # 起始字号，长名字会自动缩小
  stroke_width: 11.0    # 基准笔宽（笔迹坐标系 1000x420），长笔画会自动加粗
  flourish: true        # 最后那一笔收尾弧线（签名感全靠它）
  flourish_width: 5.2
  min_stroke_len: 12    # 过滤碎笔，调大画面更"简"
  jitter: true          # 每个字轻微上下浮动，避免印刷感
  order: true           # 排笔顺：复用 brush.py 那套（左右结构先左偏旁后右偏旁、
                        # 再就近落笔，每笔按走向定起笔端）。关掉就退回"最近端点贪心"，
                        # 笔会在字里乱跳——除非你想看对比，否则别关。
  stroke_order: true    # 真实笔顺：按 hanzi-writer 的标准中线排（app/pipeline/hanzi.py）。
                        # 田先竖再横折最后封口、火先中间长撇、口三笔不绕圈——
                        # 这些靠几何是猜不出来的。第一次遇到某个字才联网取（约 2KB），
                        # 存 data/strokes/ 之后永久离线。拿不到自动退回上面的几何排序。
  taper: true           # 每笔逐点笔宽：落笔顿 -> 中段实 -> 收笔收尖。
                        # 关掉就是整笔一个宽度（老样子，明显的"电脑画的"味道）

  # ---- 豆包网页版（provider: doubao 时生效）
  # 登录态存在仓库里的 .chrome-doubao/，不碰你日常用的 Chrome。
  # 掉登录就跑：python scripts/doubao_login.py --wait，扫码一次能管很久。
  doubao:
    port: 9222
    profile: ".chrome-doubao"
    show: true          # 必须留窗口：豆包对无头浏览器会降级/要验证
    # 等出图的总超时（秒）。豆包一张/一批实测 20~35 秒，排队时能到 60 秒，
    # 所以这里给得宽：**等到它真画完**，不要早早判超时退回本地笔画。
    # 代码里还有 25 秒的下限（填更小的值也会按 25 走）。
    # 出完图浏览器不关：窗口、标签页、会话全部留着，下一批直接接着写。
    timeout: 240
    cutout: true        # 无模板时：白底字 -> 透明笔迹

    # ---- 批量写字（现在的主路径）----
    # 一次把队列里最多 batch 个名字交给豆包，让它照 template 的风格
    # **竖着写成一列**；回来按行切开（app/pipeline/wordsheet.py），
    # 一人一份透明笔迹，再各自贴到 plate 的中间留白处。
    # 会话沿用同一个（不再每张开新对话），但模板图每批都重新上传一次。
    batch: 5
    template: "overlay/assets/word_template.jpg"   # 风格参考：白底「智纪元」
    plate: "overlay/assets/poster_clean.jpg"       # 直播背景（1080x1920，中间留白）

    # 名字贴在背景的哪儿：中心点 + 最大宽高（播放坐标 1080x1920）。
    # 实测这块留白是 y 800~1180、整幅宽度都干净，所以居中放，长名字自动缩。
    place:
      cx: 540
      cy: 990
      max_w: 820
      max_h: 330

    # 只有一个名字时用短的：就一句"照这张图换个字"，不排"几行一列"，
    # 模型当改字处理，笔迹和背景都跟着模板图走。
    single_prompt: ""
    edit_prompt: ""     # 改整张海报用的提示词（老路子，留空用内置）
    prompt: ""          # 多个名字排一列的提示词（留空用内置 BATCH_PROMPT）

  # ---- 本地扩散模型（provider: sdcn 时生效）
  # 推理在**独立进程**里跑，跟主程序不共享环境：
  #   python scripts/fetch_models.py       # 从魔搭拉 SD1.5（约 4.3G，只拉一次）
  #   python scripts/sdcn_server.py        # 冷启动约 10~20 秒
  # 主程序只做 HTTP 调用，所以没装 torch / 服务没起 / 显存被占 都不影响直播，
  # 一律退回 local 笔画（main.py 那条兜底链）。
  sdcn:
    url: "http://127.0.0.1:7863"
    # ---- 字形与材质（这两行决定"好不好看"）
    # font 只影响 sdcn 这条路的初始图（字形来源）；留空 = 用上面 signature.font 的楷体。
    # 已经下好在 overlay/assets/fonts/ 里：
    #   MaShanZheng.ttf            马善政毛笔楷书：笔锋重、有飞白，最像"写"的
    #   ZhiMangXing.ttf            志莽行书：连笔，最艺术，但个别字会糊（不推荐做名字）
    #   ZCOOLQingKeHuangYou.ttf    站酷庆科黄油体：粗黑潮牌感，配立体挤出最好看
    #   LiuJianMaoCao.ttf / LongCang.ttf / ZCOOLKuaiLe.ttf / ZCOOLXiaoWei.ttf
    # 注意：local 那条路（骨架提笔画）仍然必须用楷体，行书连笔会提不出笔顺。
    font: "overlay/assets/fonts/ZhiMangXing.ttf"
    style: gold           # 材质，见 app/pipeline/glyphstyle.py（后台也能切）：
                          #   ink     平涂墨色（最稳，和海报最协调）
                          #   emboss  立体浮雕（左上打光 + 投影）
                          #   extrude 立体挤出（往右下拖出有厚度的块，最 3D）
                          #   gold    烫金立体（金色渐变 + 高光带，最贵气）← 现在用这个
                          #   chrome  镀铬；neon 霓虹（深色背景才好看）
    timeout: 120          # 单张出图超时（秒）。3060 上实测 2~4 秒，给得宽松是因为
                          # 第一张要热显存/编译 kernel，偶尔会到 10 秒
    size: 0               # 初始图宽度。0 = 按字数自动（一个字 320px，768~1024）
    steps: 16             # DPM++ 2M 的步数；乘上 strength 才是实际 UNet 次数
                          # （16 × 0.42 ≈ 6 次，约 2 秒）
    strength: 0.55        # **最重要的一个参数**：让模型发挥多少。
                          # 0.35 = 只把字体边缘磨成毛笔边（最安全，也最像字体）
                          # 0.55 = 笔画明显变粗、有飞白和干笔毛刺（推荐）
                          # 0.65+ = 模型开始自己加印章/落款小字（有兜底过滤，但别贪）
    cfg: 7.5              # img2img 用标准 CFG，别开太高（会脏）
    tint: [6, 84, 74]     # 笔迹颜色（RGB）。海报上的字是墨绿 #06544a，模型给的是黑墨，
                          # 统一染成海报色贴上去才像本来就画在那儿。留空 [] = 保留模型原色
                          # （染色时会顺带抬一下 alpha，否则渐变边会发虚发浅）
    seed: 0               # 0 = 每次随机（同一个名字有细微差别，反而更像手写）
    plate: "overlay/assets/poster_clean.jpg"
    place:
      cx: 540
      cy: 990
      max_w: 820
      max_h: 330
    prompt: ""            # 留空用 sdcn_server.py 里的内置提示词（只要质感、纯白底）
    negative: ""          # 同上

  # ---- 可选 AI 出图（provider: ai 时生效）
  base_url: "https://ark.cn-beijing.volces.com/api/v3"
  api_key: ""
  model: "doubao-seedream-5-0-flash-260915"
  size: "1024x1024"
  watermark: false
  timeout: 90
  prompt: ""            # 留空用内置提示词模板（内含 {name}）

# ---------------------------------------------------------------- 祝福语音
# 每写一个名字，配一句专属祝福，和运笔同时开口、写完同时收声（见 app/voice.py）。
# 全链路都允许失败：没网 / 没装 edge-tts / AI 挂了 → 这一单不出声，写字照常。
voice:
  enabled: true
  # 合成引擎：
  #   auto = 先用 edge-tts（微软在线，音质最好、免费），连不上自动退回系统语音
  #   edge = 只用 edge-tts（连不上就没声）
  #   sapi = 只用 Windows 自带语音（离线、音质一般，但一定能出声）
  # 国内网络直连 speech.platform.bing.com 经常被重置，auto 是最省心的。
  engine: auto
  # 走代理的话填这里（如 "http://127.0.0.1:7890"）。edge-tts 内部把代理写死成
  # None 会盖掉系统代理，所以有梯子必须显式填——留空 = 直连。
  proxy: ""
  # 音色。edge-tts 的中文音色都是免费的，换一个就换个人说话。
  # 其它可选：zh-CN-XiaoyiNeural / zh-CN-YunxiNeural / zh-CN-YunjianNeural
  #          zh-CN-YunyangNeural / zh-CN-liaoning-XiaobeiNeural
  voice: "zh-CN-XiaoxiaoNeural"
  rate: "+8%"           # 语速。直播间环境偏吵，比默认稍快一点听着更精神
  volume: "+0%"

  # 文案从哪来：
  #   ai       = 让 deepseek 按名字现写一句（约 1~2 秒，写不出来自动退回模板）
  #   template = 只用下面的模板库，不联网
  source: template
  ai:
    # 留空 api_key = 借用上面 moderation 那把（同一家的 key，不用配两遍）
    api_key: ""
    base_url: ""
    model: "deepseek-flash"
    timeout: 6.0
  max_chars: 26         # 文案上限。再长就断在最后一个标点——一句祝福不该念 15 秒

  # 模板兜底。{n} 会被替换成名字。
  # pick: rotate  = 按顺序轮播 10 句（推荐），相邻两个观众一定不重句
  #       stable  = 同一个名字永远同一句（按 md5 定死，容易撞车）
  #       random  = 每次随机抽一句（可能连着重复）
  #
  # 下面这 10 + 5 条是 scripts/gen_voice_texts.py 一次性生成的（一次性花了约 1800
  # token），之后**永久固定**，每个名字只替换 {n}，不再调任何 API。
  # 想换一批：python scripts/gen_voice_texts.py --apply（会重新生成并写回本文件）
  # 想自己改词：直接编辑下面的行，改完重启即可。
  pick: rotate
  templates:
    - "{n}，愿你每天睡得踏实，三餐吃得香，身体一年比一年硬朗。"
    - "{n}，盼你手上活儿顺顺当当，升职加薪都赶得上，越忙越有奔头。"
    - "{n}，愿你遇见一个懂你的人，吵完架也愿意先低头，日子越过越甜。"
    - "{n}，愿你钱包慢慢鼓起来，想买的东西不用犹豫，攒下的钱都有去处。"
    - "{n}，愿你心里少装点烦心事，遇到坎儿也能笑出来，天天都自在。"
    - "{n}，愿你家里老人身体好，孩子懂事又贴心，一家人围桌吃饭最踏实。"
    - "{n}，愿你今年能出趟远门，看看山和海，回来时行李箱装满故事。"
    - "{n}，愿你早起有热豆浆喝，下班路上能碰上晚霞，小事都顺心。"
    - "{n}，愿你考试提笔就有思路，复习的都考到，成绩出来能笑出声。"
    - "{n}，愿你晚上躺下就睡着，早上醒来有精神，一天到晚都轻快。"
  gift_templates:
    - "{n}，谢谢你这份心意，愿你往后天天顺心，赚得多花得也开心，笑声比谁都响。"
    - "{n}，你这份心意我记住了，愿你生意越来越红火，付出都有回响，数钱数到手软。"
    - "{n}，谢谢你的慷慨，愿你家人平安健康，饭桌上热热闹闹，一年比一年富足。"
    - "{n}，收到你的心意真高兴，愿你身体硬朗，想做啥都做得成，日子越过越宽。"
    - "{n}，这份礼我收下了，愿你工作越干越顺，钱袋子鼓鼓的，笑起来眼里都有光。"

  # ---- 时长对齐（voice.fit_duration）
  # 运笔 = max(档位时长, 语音时长 + tail)，上限 max_seconds。
  # 意思是：话比字长就把字写慢一点，话短就不动——收笔和收音几乎同时。
  tail: 0.25
  max_seconds: 20
  keep_days: 7          # data/voice 里的 mp3 留几天

  # 单句配音最多等几秒（文案 + 合成）。超了就先播、这单没声音——
  # 直播里"晚 3 秒出声"和"卡住不写字"是两种性质的事故，只能保后者。
  max_wait: 12
  # edge-tts 正常 2~3 秒，但网络抖一下能到 9 秒（实测过，那一单直接哑了）。
  # 超过这个秒数还没结果，就**同时**叫 Windows 自带语音（离线 0.7 秒）并肩跑，
  # 谁先好谁用。代价是那一句换了音色，好处是再也不会整句没声音。
  # 设 0（或大于等于 max_wait）= 关掉对冲，退回"干等到超时就放弃"的老行为。
  hedge_after: 7
  # 单次 edge 请求的硬超时。正常用不到；防的是连接挂死——
  # 挂死时 wait_for 那头永远不会返回，线程会一直占着。
  edge_timeout: 15

# ---------------------------------------------------------------- 礼物档位
# 只决定"写多久、笔触多讲究"，不改变写的内容。
# hold_seconds = 收笔、成图淡入之后，把完整的成图留在画面上的秒数（截图时间）。
# 三个档位现在都是 3 秒，想让高等档多停一会儿，改各自的值就行。
tiers:
  - key: honor
    name: 尊签
    min_value: 30
    duration: 13.0
    hold_seconds: 3.0
    stroke_width: 12.6
    flourish_width: 6.4
  - key: gift
    name: 礼签
    min_value: 1
    duration: 9.0
    hold_seconds: 3.0
    stroke_width: 11.8
  - key: plain
    name: 素签
    min_value: 0
    duration: 6.0
    hold_seconds: 3.0
    stroke_width: 11.0

# 礼物名 -> 金额（元）。平台事件里带 value/diamond 时优先用事件里的。
gifts:
  小心心: 0.1
  玫瑰: 1
  墨镜: 9
  跑车: 30
  嘉年华: 300

queue:
  max: 30
  gift_jump: true       # 送礼插到队首
  prefix: ""            # 留空 = 整条弹幕就是名字；填"签名"则只认"签名 张三"

  # ---- 生图节流：队列每 20 秒去生成一次
  # 一次把队列里的真人单取走（最多 signature.doubao.batch 个）交给豆包。
  # 队伍里没有真人名字就一直不生成 —— 空场只播素材库，不烧额度。
  # 空闲很久之后的第一个名字不用干等：立刻开工，之后每批之间隔这么久。
  gen_every: 20

  # ---- 名字去重（一场直播里同一个名字只写一遍）
  # 判定前先归一化：全角转半角、去掉空格、英文不分大小写，
  # 所以「ＴＴ」「tt」「 T t 」算同一个名字。
  # 下面三种情况都算重复：排队中 / 正在写 / 窗口期内刚写过。
  dedupe:
    window: 1800        # 写完之后多少秒内不再重复写。0 = 关掉去重（全都照写）
    across: name        # name = 只要名字一样算重复（推荐）
                        # user = 同一个人重复才算，不同人打同名各写一次
    gift_bypass: true   # 送礼的单是否绕过去重：true = 花了钱可以再写一次
                        # （排队中那张仍会合并成一张并插队，不会写两遍）

  # 送礼插到哪儿：true = 永远插到"当前正在写的那一单"的下一位（后送的排前面，
  # 最新一次打赏最显眼）；false = 排在前面已插队的礼物后面（先送的先画，更公平）。
  gift_after_current: true

  # 右上角队列面板**固定显示几行**。真实名字永远看得见：他从最后一行进队，
  # 前面那几位虚拟观众是真在播的，播完一个他往上顶一格，队尾同时补一个新虚拟进来，
  # 所以面板永远是满的 8 行，他一路顶到第 1 行就开始被写。
  # 想要"8 个虚拟在前、真人排第 9"的老观感就把它设成 9（等于 8 虚拟 + 真人）。
  panel_slots: 8

  # 老参数：只在不写 panel_slots 时用来推算行数（real_from - 1 = 虚拟区行数）。
  # 现在面板改成固定行数了，留它是为了兼容旧配置。
  real_from: 9

  # 真人进队后，面板上他前面那 8 位虚拟观众会**真的依次播完**，才轮到他。
  # 每张成图约 8 秒运笔 + 3 秒展示，8 位大约 80~90 秒——这是"排第 9 就真等 8 位"的代价。
  # 设 0 = 只占面板位置、立刻写（等 2~3 秒就出图）。礼物永远不等这个，直接插队。
  ghost_wait: 8

  # 面板最多显示几行（含虚拟观众）。超出的折成"…"+ 队尾一行，
  # 队尾那位就是刚打完名字的人 —— 等于告诉他"你排第几"。
  panel_rows: 12

# ---------------------------------------------------------------- 名字审核
# 观众的名字会被写成书法大字打在公屏上，等于替他在公开画面上说话。
# 入队前先审一道：涉政、涉黄、辱骂、暴力、广告引流、违法违禁 —— 都不写。
# 两层：本地黑名单（微秒级，广告/脏话/赌博这类）→ deepseek-flash（语境判断，约 1~2 秒）。
moderation:
  enabled: true
  api_key: "YOUR_DEEPSEEK_API_KEY"
  base_url: "https://api.deepseek.com/v1"
  model: "deepseek-flash"   # deepseek-flash（推理模型，快）/ deepseek-v4-pro（更稳更慢）
  timeout: 6.0              # 单个名字最多等这么久
  fail_open: true           # 审核服务挂了/超时：true = 放行（不卡队列），false = 拦截
  cache: 800                # 一场直播里同一个名字只问一次

# ---------------------------------------------------------------- 背景轮换
# 一场直播十几小时都铺同一张海报，画面上就是"一圈一圈重复"——平台判定录播
# 最省事的一条特征。后台「直播背景」里可以存多张，按下面的规则自动换。
#
# 硬约束：库里的背景**必须是同一版式**（字位固定在 193,851 - 893,1148）。
# 换色、换纹理、换四周装饰都行，版式不同字就写到别处去了。
background:
  rotate: false       # 自动轮换开关。库里不足 2 张时开了也不动
  every: 6            # 每写完 6 个名字换一张（只在空场、两张字之间换）

# ---------------------------------------------------------------- 真人小窗
# 后台「真人出镜小窗」上传的视频。位置/尺寸存在 overlay/assets/cam/_cam.json，
# 这里只放两件"跟机器有关"的事。
cam:
  ffmpeg: ""          # 转码用的 ffmpeg 路径。留空 = 自动找（PATH → 常见目录）
  # 为什么要转码：手机/剪映导出的竖屏视频大量是 HEVC(H.265)，浏览器内核
  # （尤其直播伴侣的 CEF）多数**解不了**，表现是画面上一个纯黑方块。
  # 上传时会自动探测编码，不是 H.264 就用 ffmpeg 转一遍（去掉音轨，反正静音播）。
  max_mb: 200         # 单个视频上限

virtual:
  enabled: true         # 空场保底总开关
  # 空场不再叫豆包，直接播 data/signatures 里已经生成好的成图（见 app/library.py）。
  # library: false 才回到"从名字池现生成"的老路子，一般不用关。
  library: true
  loop: cycle           # cycle=按时间倒序轮播已有成图 | repeat=一直播同一张
  names: []             # 素材库空着时用它起头（本地笔画，不联网）；留空用内置 20 个

paths:
  data: data
