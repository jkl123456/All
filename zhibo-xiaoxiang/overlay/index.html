<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>直播间·头像简笔画</title>
<link rel="stylesheet" href="/overlay/style.css?v=13">
</head>
<body>
<div id="stage">
  <div class="desk"></div>
  <div class="desk-light"></div>

  <header class="topbar">
    <div class="brand">头像简笔画 · 现场手绘</div>
    <div class="counter">已画 <b id="done">0</b> 幅</div>
  </header>

  <!-- 左上角：已经画完的几张，随手摞在桌上 -->
  <section class="stack" id="stack"></section>

  <!-- 左上角：礼物 ↔ 画种对照表，悬浮在桌上（绿幕已抠掉，卡片自带半透明黑底） -->
  <div class="rules">
    <img src="/overlay/assets/rules.webp" alt="" aria-hidden="true">
    <div class="rules-note">礼物可以插队</div>
  </div>

  <!-- 右上：手机，屏幕上就是接单列表（前 5 位） -->
  <div class="phone">
    <div class="ph-body">
      <div class="ph-notch"></div>
      <div class="ph-screen">
        <div class="ph-head">
          <span class="ph-app">画面接单</span>
          <span class="ph-live"><i></i>直播中</span>
        </div>
        <div class="ph-count"><span class="dot"></span> 排队 <b id="qlen">0</b> 人</div>
        <div class="hud-queue" id="qlist"></div>
        <div class="ph-foot">扣 1 排队 · 送礼物插队</div>
      </div>
    </div>

  </div>

  <!-- 桌上随手放着的几支彩铅，参考实景里的散笔 -->
  <div class="props" aria-hidden="true">
    <i class="prop" style="--c:#b9463b; left:52px; top:1004px; transform:rotate(-24deg)"></i>
    <i class="prop" style="--c:#2f6f8f; left:104px; top:960px; transform:rotate(-12deg)"></i>
    <i class="prop" style="--c:#3d7a4f; left:26px; top:1064px; transform:rotate(-36deg)"></i>
  </div>

  <!-- 右下：正在画的这一张 -->
  <main class="paper">
    <div class="tape left"></div>
    <div class="tape right"></div>

    <div class="head">
      <div class="avatar-wrap no-photo" id="avWrap">
        <img id="av" class="avatar" alt="">
        <span class="avatar-init" id="avInit">待</span>
      </div>
      <div class="who">
        <div class="nick" id="nick">等待接单…</div>
        <div class="sub" id="sub">扣 1 排队 · 送礼物插队</div>
      </div>
      <div class="tier t-simple" id="tier">简单</div>
      <div class="scorebox" id="scorebox">
        <div class="score" id="score">--</div>
        <div class="scorelabel">评分</div>
      </div>
    </div>

    <div class="draw-area" id="drawArea">
      <canvas id="wash" width="900" height="900"></canvas>
      <canvas id="ink" width="900" height="900"></canvas>
      <div class="grid"></div>
      <!-- Cover the AI stamp that sits in the bottom-right of every generated
           picture. Even if a stray stroke slips through, it lands behind this. -->
      <div class="stamp-cover">
        <div class="stamp-title">今日手绘</div>
        <div class="stamp-name" id="stampName">@等待接单</div>
      </div>
      <div id="pen">
        <!-- The sharpened point sits exactly on (100,100) of the viewBox, which
             lands on the pen's anchor point, so whatever angle the group is
             rotated by the tip keeps touching the paper. 132deg puts the
             eraser at the lower right and the point at the upper left.
             The hand sits in the same group, so it turns with the pencil and
             always grips the barrel at the same spot. -->
        <svg viewBox="-50 -50 300 300" width="390" height="390">
          <defs>
            <linearGradient id="skinP" gradientUnits="userSpaceOnUse" x1="50" y1="-20" x2="200" y2="90">
              <stop offset="0" stop-color="#f9dcc1"/>
              <stop offset=".62" stop-color="#eabf9b"/>
              <stop offset="1" stop-color="#d69c74"/>
            </linearGradient>
            <linearGradient id="barrel" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#dfa42e"/>
              <stop offset=".35" stop-color="#ffd97f"/>
              <stop offset="1" stop-color="#d89a24"/>
            </linearGradient>
            <filter id="handShadow" x="-45%" y="-45%" width="190%" height="190%">
              <feDropShadow dx="2" dy="3" stdDeviation="3"
                            flood-color="rgba(70,40,20,.32)"/>
            </filter>
          </defs>
          <g transform="rotate(132 100 100)">
            <g filter="url(#handShadow)" transform="translate(0,-26)">
              <ellipse cx="152" cy="34" rx="46" ry="40" transform="rotate(-10 152 34)"
                       fill="url(#skinP)"/>
              <g fill="url(#skinP)" stroke="rgba(150,100,70,.38)" stroke-width="1.5">
                <rect x="74" y="8"  width="86" height="15" rx="7.5" transform="rotate(-6 117 15)"/>
                <rect x="70" y="25" width="90" height="15" rx="7.5" transform="rotate(-3 115 32)"/>
                <rect x="70" y="42" width="90" height="15" rx="7.5" transform="rotate(1 115 49)"/>
                <rect x="74" y="59" width="86" height="15" rx="7.5" transform="rotate(4 117 66)"/>
              </g>
              <rect x="96" y="52" width="76" height="17" rx="8.5"
                    transform="rotate(-24 134 60)" fill="url(#skinP)"
                    stroke="rgba(150,100,70,.38)" stroke-width="1.5"/>
            </g>

            <polygon points="100,100 89,77 111,77" fill="#2b2b2b"/>
            <polygon points="89,77 111,77 111,66 89,66" fill="#e9cba4"/>
            <rect x="88" y="-12" width="24" height="78" fill="url(#barrel)"/>
            <rect x="88" y="-12" width="7" height="78" fill="#ffe1a0"/>
            <rect x="88" y="-20" width="24" height="8" fill="#e4a0a0"/>
            <rect x="88" y="-20" width="24" height="8" fill="none" stroke="#b97b7b" stroke-width="1.4"/>
          </g>
        </svg>
        <div class="tipshadow"></div>
      </div>
    </div>

    <div class="foot">
      <span id="hint">笔尖准备中…</span>
      <span id="build">v13</span>
    </div>
  </main>

  <div class="toast" id="toast"></div>
</div>
<script>console.log("overlay build v12");</script>
<script src="/overlay/draw.js?v=13"></script>
</body>
</html>
